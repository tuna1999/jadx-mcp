name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        run: ./gradlew build --stacktrace

      - name: Verify fat jar runs
        run: java -jar build/libs/jadx-mcp.jar --help >/dev/null

      - name: Prepare artifacts
        run: |
          mkdir -p dist
          cp build/libs/jadx-mcp.jar dist/
          cd dist && sha256sum jadx-mcp.jar > jadx-mcp.jar.sha256

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/jadx-mcp.jar
            dist/jadx-mcp.jar.sha256
