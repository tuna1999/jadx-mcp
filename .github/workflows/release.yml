name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compute version from tag
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build and test (version ${{ steps.ver.outputs.version }})
        run: ./gradlew build --stacktrace -PappVersion=${{ steps.ver.outputs.version }}

      - name: Verify fat jar runs and reports the tag version
        run: |
          JAR="build/libs/jadx-mcp-${{ steps.ver.outputs.version }}.jar"
          java -jar "$JAR" --help >/dev/null
          test "$(java -jar "$JAR" --version)" = "${{ steps.ver.outputs.version }}"

      - name: Prepare artifacts
        run: |
          V=${{ steps.ver.outputs.version }}
          JAR="build/libs/jadx-mcp-$V.jar"
          test -f "$JAR"
          mkdir -p dist
          cp "$JAR" dist/
          cd dist && sha256sum "jadx-mcp-$V.jar" > "jadx-mcp-$V.jar.sha256"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/jadx-mcp-${{ steps.ver.outputs.version }}.jar
            dist/jadx-mcp-${{ steps.ver.outputs.version }}.jar.sha256
